# Pre-warms one sandbox built from secured-template, so a SandboxClaim resolves
# instantly instead of cold-starting. Bump `replicas` for a bigger pool.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: secured-pool
  namespace: agent-sandbox-demo
spec:
  replicas: 1
  updateStrategy:
    type: Recreate
  sandboxTemplateRef:
    name: secured-template
