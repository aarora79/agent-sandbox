# RuntimeClass for Kata using the Firecracker hypervisor (microVM).
# Created by `kata-deploy` as "kata-fc" on a KVM-capable Linux node.
# Firecracker needs a devmapper snapshotter configured in containerd (see README).
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-fc # Kata + Firecracker VMM — minimal device model, fast microVM boot
handler: kata-fc
overhead:
  podFixed:
    cpu: "150m"
    memory: "130Mi"
scheduling:
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
